<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fooocus2025 — Asset Browser</title>
<link rel="stylesheet" href="_assets/photoswipe.css" />
<link rel="stylesheet" href="_assets/photoswipe-dynamic-caption-plugin.css" />
<style>
  /* M3 final: 4 tabs + PhotoSwipe lightbox + Dynamic Caption sidebar + Deep Zoom. */
  :root {
    --bg: #121212;
    --panel: #1c1c1c;
    --border: #2c2c2c;
    --text: #e0e0e0;
    --muted: #888;
    --accent: #bb86fc;
    --accent-2: #4ecdc4;
    --warn: #c80;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 500; }
  header h1 .badge {
    margin-left: 10px; padding: 2px 8px; border-radius: 4px;
    background: #333; color: var(--muted); font-size: 11px;
  }
  nav.tabs { display: flex; gap: 4px; }
  nav.tabs button {
    background: transparent; color: var(--text);
    border: 1px solid var(--border); padding: 6px 14px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  nav.tabs button:hover { background: #2a2a2a; }
  nav.tabs button.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .layout { display: grid; grid-template-columns: 240px 1fr; height: calc(100vh - 53px); }
  aside {
    background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 8px;
  }
  aside h3 {
    margin: 8px 8px 4px; font-size: 11px; text-transform: uppercase;
    color: var(--muted); letter-spacing: 0.05em;
  }
  aside .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; border-radius: 4px; cursor: pointer;
    color: var(--text); font-size: 13px;
    position: relative;
  }
  aside .item:hover { background: #2a2a2a; }
  aside .item.active { background: var(--accent); color: #000; }
  aside .item .count { font-size: 11px; opacity: 0.7; }
  aside .item.today { font-weight: bold; }
  aside .item.today::before { content: '● '; color: var(--accent-2); }
  /* Hide/show toggle button — appears on hover. */
  aside .item .hide-btn {
    display: none; position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.65); color: var(--text); border: 0;
    border-radius: 3px; cursor: pointer; font-size: 10px; padding: 2px 5px;
    line-height: 1.1;
  }
  aside .item:hover .hide-btn { display: inline-block; }
  aside .item:hover .count { display: none; }
  aside .item.hidden-row {
    opacity: 0.45; font-style: italic;
  }
  aside .item.hidden-row .hide-btn { display: inline-block; background: rgba(78,205,196,0.18); }
  /* Favorites virtual sidebar entry — golden hue to stand out from real subfolders. */
  aside .item.fav-row { color: #ffd54f; }
  aside .item.fav-row.active { background: #ffd54f; color: #000; }

  /* Header right cluster: extra toggles + tabs. */
  header .right {
    display: flex; align-items: center; gap: 10px;
  }
  header .toggles { display: flex; gap: 4px; }
  header .toggles button {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 4px 9px; border-radius: 5px; cursor: pointer; font-size: 12px;
    line-height: 1.2;
  }
  header .toggles button:hover { background: #2a2a2a; color: var(--text); }
  header .toggles button.on {
    background: rgba(187,134,252,0.18); color: var(--accent); border-color: var(--accent);
  }
  header .toggles button .pill {
    margin-left: 4px; background: var(--accent); color: #000;
    border-radius: 8px; padding: 0 5px; font-size: 10px; font-weight: bold;
  }

  /* NSFW blur — applied to <img> inside .card; hover/click reveals. */
  body.blur-active main .card img {
    filter: blur(20px) saturate(0.7);
    transition: filter 0.18s ease;
  }
  body.blur-active main .card:hover img,
  body.blur-active main .card.unblur img {
    filter: none;
  }
  body.blur-active main .card .label::before { content: '\1F32B  '; }
  main { overflow-y: auto; padding: 12px; }
  main .grid {
    display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  }
  main .card {
    display: block; aspect-ratio: 1 / 1; background: #000; border-radius: 6px;
    overflow: hidden; text-decoration: none; position: relative; color: inherit;
    cursor: zoom-in;
  }
  main .card img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform 0.2s ease;
  }
  main .card:hover img { transform: scale(1.04); }
  main .card .label {
    position: absolute; left: 6px; bottom: 6px; right: 6px;
    background: rgba(0,0,0,0.7); color: #fff; padding: 3px 6px;
    font-size: 10px; border-radius: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  main .card .badges {
    position: absolute; top: 6px; right: 6px;
    display: flex; gap: 4px;
  }
  main .card .badges span {
    background: rgba(0,0,0,0.65); color: var(--accent-2);
    padding: 1px 5px; border-radius: 3px; font-size: 10px;
  }
  main .card.placeholder { outline: 1px dashed var(--border); }
  main .card.negative .badges span { color: #ff8a8a; }

  /* Favorite star — top-left to avoid clashing with .badges (top-right). */
  main .card .fav-btn {
    position: absolute; top: 6px; left: 6px;
    background: rgba(0,0,0,0.55); border: 0; color: #ddd;
    width: 24px; height: 24px; border-radius: 50%;
    font-size: 14px; line-height: 22px; text-align: center;
    cursor: pointer; padding: 0;
    transition: transform 0.12s ease, background 0.12s ease;
    z-index: 2;
  }
  main .card .fav-btn:hover { background: rgba(0,0,0,0.85); transform: scale(1.15); }
  main .card .fav-btn.on { color: #ffd54f; background: rgba(0,0,0,0.75); }
  main .card .fav-btn.on:hover { color: #ffeb8a; }
  /* Subtle pinned-favorite hint (border accent on starred cards). */
  main .card.is-favorite { outline: 2px solid rgba(255, 213, 79, 0.55); outline-offset: -2px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; font-size: 14px; }
  .empty code { background: #222; padding: 2px 6px; border-radius: 3px; }
  footer {
    position: absolute; bottom: 0; right: 0; padding: 4px 10px;
    color: var(--muted); font-size: 10px;
  }

  /* PhotoSwipe Dynamic Caption — our metadata sidebar styles. */
  .pswp__dynamic-caption {
    color: var(--text); background: rgba(28,28,28,0.92); border-radius: 8px;
    font-size: 14px; line-height: 1.5; padding: 18px 20px; max-width: 520px;
    border: 1px solid var(--border);
  }
  .pswp__dynamic-caption.pswp__dynamic-caption--aside { width: 440px; }
  .pswp__dynamic-caption h2 {
    margin: 0 0 10px; font-size: 16px; color: var(--accent); word-break: break-word;
    line-height: 1.3;
  }
  .pswp__dynamic-caption .meta-row {
    display: grid; grid-template-columns: 100px 1fr; gap: 6px 12px;
    margin: 6px 0; font-size: 13px;
  }
  .pswp__dynamic-caption .meta-row .k { color: var(--muted); }
  .pswp__dynamic-caption .meta-row .v {
    color: var(--text); word-break: break-word; max-height: 5em; overflow: auto;
  }
  .pswp__dynamic-caption .copy-row {
    display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px;
    border-top: 1px solid var(--border); padding-top: 10px;
  }
  .pswp__dynamic-caption .copy-row button,
  .pswp__dynamic-caption .copy-row a {
    background: #222; color: var(--text); border: 1px solid var(--border);
    padding: 5px 10px; border-radius: 5px; font-size: 11px; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  .pswp__dynamic-caption .copy-row button:hover,
  .pswp__dynamic-caption .copy-row a:hover { background: #333; color: #fff; }
  .pswp__dynamic-caption .copy-row button.ok {
    background: var(--accent-2); color: #000; border-color: var(--accent-2);
  }
  /* Highlighted "Fetch from CivitAI" — call-to-action when no sidecar preview. */
  .pswp__dynamic-caption .copy-row button.fetch-civitai-btn {
    background: rgba(187,134,252,0.25); color: var(--accent);
    border-color: var(--accent); font-weight: 600;
  }
  .pswp__dynamic-caption .copy-row button.fetch-civitai-btn:hover:not(:disabled) {
    background: var(--accent); color: #000;
  }
  .pswp__dynamic-caption .copy-row button.fetch-civitai-btn:disabled {
    opacity: 0.7; cursor: wait;
  }
  /* Apply-update inline panel (Phase 3B v2) — buttons live INSIDE the update banner,
     no floating modal. The banner expands when the user clicks 📥 to show the
     3 backup-mode choices, then morphs into a progress text while downloading. */
  .pswp__dynamic-caption .ab-update-banner button.apply-update {
    margin-top: 6px; align-self: flex-start;
    background: var(--accent); color: #000; border: 1px solid var(--accent);
    padding: 5px 12px; border-radius: 5px; font-size: 11px; font-weight: 700; cursor: pointer;
  }
  .pswp__dynamic-caption .ab-update-banner button.apply-update:hover { background: #d4aafd; }
  .pswp__dynamic-caption .ab-update-banner button.apply-update:disabled { opacity: 0.6; cursor: wait; }
  /* Inline panel: choose / progress / done */
  .pswp__dynamic-caption .ab-update-banner .um-choose,
  .pswp__dynamic-caption .ab-update-banner .um-progress,
  .pswp__dynamic-caption .ab-update-banner .um-done {
    margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed rgba(255,255,255,0.15);
  }
  .pswp__dynamic-caption .ab-update-banner .um-choose .um-help {
    color: rgba(255,255,255,0.7); font-size: 11px; line-height: 1.5; margin-bottom: 8px;
  }
  .pswp__dynamic-caption .ab-update-banner .um-actions {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .pswp__dynamic-caption .ab-update-banner .um-actions button {
    background: #222; color: var(--text); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 5px; font-size: 11px; cursor: pointer;
  }
  .pswp__dynamic-caption .ab-update-banner .um-actions button:hover { background: #333; }
  .pswp__dynamic-caption .ab-update-banner .um-actions button.primary {
    background: rgba(187,134,252,0.22); color: var(--accent); border-color: var(--accent); font-weight: 600;
  }
  .pswp__dynamic-caption .ab-update-banner .um-actions button.primary:hover { background: var(--accent); color: #000; }
  .pswp__dynamic-caption .ab-update-banner .um-actions button.danger {
    background: rgba(200,60,60,0.18); color: #ff8a8a; border-color: #c33;
  }
  .pswp__dynamic-caption .ab-update-banner .um-actions button.danger:hover { background: #c33; color: #fff; }
  .pswp__dynamic-caption .ab-update-banner .um-progress { color: var(--accent-2); font-size: 12px; }
  .pswp__dynamic-caption .ab-update-banner .um-progress::before { content: '⏳ '; }
  .pswp__dynamic-caption .ab-update-banner .um-done.ok { color: var(--accent-2); font-size: 12px; }
  .pswp__dynamic-caption .ab-update-banner .um-done.fail { color: #ff8a8a; font-size: 12px; }

  /* CivitAI update-check banner (Phase 3A) — appears in the lightbox caption of
     every model item. Three visual states: checking / up-to-date / update-available.
     Silently removed by JS when the model isn't on CivitAI (no noise for non-CivitAI users). */
  .pswp__dynamic-caption .ab-update-banner {
    margin: 10px 0; padding: 8px 10px; border-radius: 6px;
    font-size: 12px; line-height: 1.45;
    background: #2a2a2a; color: var(--muted);
  }
  .pswp__dynamic-caption .ab-update-banner.checking::before { content: '⏳ '; opacity: 0.7; }
  .pswp__dynamic-caption .ab-update-banner.ok {
    background: rgba(78,205,196,0.12); color: var(--accent-2);
  }
  .pswp__dynamic-caption .ab-update-banner.new {
    background: rgba(187,134,252,0.16); color: var(--accent);
    border: 1px solid var(--accent);
    display: flex; flex-direction: column; gap: 4px;
  }
  /* Cross-architecture upgrade (SDXL -> Flux etc.) — orange warning, not gold accent. */
  .pswp__dynamic-caption .ab-update-banner.upgrade {
    background: rgba(204, 136, 0, 0.16); color: #ffb84d;
    border: 1px solid #c80;
    display: flex; flex-direction: column; gap: 4px;
  }
  .pswp__dynamic-caption .ab-update-banner.upgrade b { color: #ffd99a; }
  .pswp__dynamic-caption .ab-update-banner.upgrade button.apply-update {
    background: #c80; color: #000; border-color: #c80;
  }
  .pswp__dynamic-caption .ab-update-banner.upgrade button.apply-update:hover { background: #e0a020; }
  .pswp__dynamic-caption .ab-update-banner .ab-update-cur { font-size: 11px; opacity: 0.7; }
  .pswp__dynamic-caption .ab-update-banner b { color: inherit; font-weight: 700; }

  /* Lightbox Delete button — danger styling, pushed to the right edge of the row. */
  .pswp__dynamic-caption .copy-row button.lb-delete {
    margin-left: auto;
    background: rgba(200, 60, 60, 0.18); color: #ff8a8a;
    border-color: #c33; font-weight: 600;
  }
  .pswp__dynamic-caption .copy-row button.lb-delete:hover:not(:disabled) {
    background: #c33; color: #fff;
  }
  .pswp__dynamic-caption .copy-row button.lb-delete:disabled { opacity: 0.7; cursor: wait; }

  /* Lightbox favorite button — gold accent when active, mirrors the card star. */
  .pswp__dynamic-caption .copy-row button.lb-fav.on {
    background: rgba(255, 213, 79, 0.18); color: #ffd54f;
    border-color: #ffd54f; font-weight: 600;
  }
  .pswp__dynamic-caption .copy-row button.lb-fav.on:hover {
    background: #ffd54f; color: #000;
  }

  /* === Batch CivitAI fetch — floating progress overlay bottom-right ===
     Always above PhotoSwipe (z-index 10000) so it stays visible if the user
     opens the lightbox while a batch is running. Click-through outside the
     panel itself (no full-screen backdrop — user can keep browsing). */
  #batch-overlay {
    position: fixed; right: 16px; bottom: 16px;
    width: 340px; background: var(--panel); color: var(--text);
    border: 1px solid var(--accent); border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.6);
    padding: 12px 14px; font-size: 12px; z-index: 10000;
    display: none;
  }
  #batch-overlay.on { display: block; }
  #batch-overlay h4 { margin: 0 0 8px; font-size: 13px; color: var(--accent); }
  #batch-overlay .bar {
    height: 8px; background: #2a2a2a; border-radius: 4px;
    overflow: hidden; margin: 6px 0 8px;
  }
  #batch-overlay .bar .fill {
    height: 100%; background: var(--accent); width: 0%;
    transition: width 0.25s ease;
  }
  #batch-overlay .row { display: flex; justify-content: space-between; margin: 4px 0; }
  #batch-overlay .row .k { color: var(--muted); }
  #batch-overlay .row .v { color: var(--text); font-family: ui-monospace, monospace; font-size: 11px;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #batch-overlay .current { color: var(--accent-2); }
  #batch-overlay .skipped { color: var(--muted); }
  #batch-overlay .failed { color: #ff8a8a; }
  #batch-overlay .actions { margin-top: 10px; display: flex; gap: 6px; justify-content: flex-end; }
  #batch-overlay button {
    background: #222; color: var(--text); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;
  }
  #batch-overlay button.cancel:hover { background: #c33; color: #fff; border-color: #c33; }
  #batch-overlay button.close:hover { background: #333; }
  .pswp__dynamic-caption .triggers, .pswp__dynamic-caption code {
    background: #111; padding: 6px 8px; border-radius: 4px; display: block;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: #c8b6e8; word-break: break-all;
  }
</style>
</head>
<body>
<header>
  <h1>🖼️ Fooocus2025 — Asset Browser <span class="badge" id="badge-status">M3 · PhotoSwipe lightbox</span></h1>
  <div class="right">
    <div class="toggles" id="header-toggles">
      <input type="text" id="search-input" placeholder="Search…" title="Filter by filename, trigger words, prompt"
             style="background:#2a2a2a;color:#e0e0e0;border:1px solid #555;border-radius:4px;padding:4px 8px;font-size:13px;width:180px;margin-right:8px;">
      <select id="sort-select" title="Sort order (per tab, saved). Favorites are always pinned at the top."
              style="background:#2a2a2a;color:#e0e0e0;border:1px solid #555;border-radius:4px;padding:4px 6px;font-size:13px;margin-right:8px;">
        <option value="filename_asc">Name ↑</option>
        <option value="filename_desc">Name ↓</option>
        <option value="modified_desc">Modified ↓</option>
        <option value="modified_asc">Modified ↑</option>
        <option value="size_desc">Size ↓</option>
        <option value="size_asc">Size ↑</option>
      </select>
      <button id="btn-blur"        title="Blur all thumbnails (NSFW privacy). Hover or click to reveal individually.">🌫️ Blur</button>
      <button id="btn-show-hidden" title="Reveal hidden days / subfolders (use the eye-slash button on each item to hide it).">👁️ Hidden</button>
      <button id="btn-batch-fetch" title="Fetch missing CivitAI previews for ALL models (LoRAs + checkpoints + embeddings). Sequential with throttle." style="display:none;">🌐 Fetch missing</button>
    </div>
    <nav class="tabs" id="tabs">
      <button class="active" data-tab="outputs">📅 Outputs</button>
      <button data-tab="loras">🎨 LoRAs</button>
      <button data-tab="checkpoints">📦 Models</button>
      <button data-tab="embeddings">🧩 Embeddings</button>
    </nav>
  </div>
</header>

<div class="layout">
  <aside id="sidebar">
    <h3 id="sidebar-title">Days</h3>
    <div id="sidebar-list"><div class="empty">Loading…</div></div>
  </aside>
  <main>
    <div id="main-area"><div class="empty">Pick an item on the left.</div></div>
  </main>
</div>
<footer id="footer"></footer>

<!-- Batch CivitAI fetch overlay — hidden until a batch is running. -->
<div id="batch-overlay" role="status" aria-live="polite">
  <h4>🌐 Fetching CivitAI previews</h4>
  <div class="bar"><div class="fill" id="batch-fill"></div></div>
  <div class="row"><span class="k">Progress</span><span class="v" id="batch-progress">0 / 0</span></div>
  <div class="row"><span class="k">Current</span><span class="v current" id="batch-current">—</span></div>
  <div class="row"><span class="k">Succeeded</span><span class="v" id="batch-ok">0</span></div>
  <div class="row"><span class="k">Skipped (not on CivitAI)</span><span class="v skipped" id="batch-skipped">0</span></div>
  <div class="row"><span class="k">Failed (network / rate-limit)</span><span class="v failed" id="batch-ko">0</span></div>
  <div class="actions">
    <button class="cancel" id="batch-cancel">Cancel</button>
    <button class="close"  id="batch-close" style="display:none;">Close & reload</button>
  </div>
</div>

<!-- (Phase 3B v2: the floating modal was replaced by an inline panel that mutates
     the update banner in-place — see the Update module in script below.) -->

<script type="module">
import PhotoSwipeLightbox from './_assets/photoswipe-lightbox.esm.js';
import PhotoSwipe from './_assets/photoswipe.esm.js';
import PhotoSwipeDynamicCaption from './_assets/photoswipe-dynamic-caption-plugin.esm.js';
import DeepZoom from './_assets/photoswipe-deep-zoom-plugin.esm.js';

/**
 * M3 SPA: 4 tabs (Outputs + LoRAs + Models + Embeddings).
 * Each tab opens a PhotoSwipe v5 lightbox on click. Dynamic Caption
 * renders a metadata sidebar (per-tab template). Deep Zoom is wired but
 * only kicks in when an item provides `dzi.tileUrl` (M3 ships without
 * DZI tile generation — Deep Zoom falls back to PhotoSwipe's regular
 * scroll/pinch zoom on the full image, which is fine for outputs and
 * model preview thumbnails).
 */

const $tabs = document.getElementById('tabs');
const $sidebarTitle = document.getElementById('sidebar-title');
const $sidebarList = document.getElementById('sidebar-list');
const $main = document.getElementById('main-area');
const $footer = document.getElementById('footer');

const fmtCount = (n, singular, plural) =>
  `${n} ${n === 1 ? singular : (plural || singular + 's')}`;
const fmtBytes = b => {
  if (b == null) return '';
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0; let v = b;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(v < 10 ? 1 : 0) + ' ' + u[i];
};
const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMP = (w, h) => (w && h) ? ((w * h) / 1_000_000).toFixed(2) + ' MP' : '';

async function fetchJson(path) {
  try {
    const r = await fetch(path, { cache: 'no-store' });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

function renderEmpty(target, msg) { target.innerHTML = `<div class="empty">${msg}</div>`; }

// =================== Hide / Blur state (localStorage-backed) ===================
//
// `hidden` is a per-scope set of keys (e.g. scope='outputs:days', key='2024-05-22').
// `blur` reads the SPA default from _index/spa_settings.json AND a localStorage
// override (so user can flip it temporarily on a shared machine). `showHidden`
// is a transient view mode — when ON, hidden items reappear greyed with an
// unhide button.
const LS_HIDDEN     = 'fooocus2025_assetbrowser_hidden';
const LS_BLUR_OVR   = 'fooocus2025_assetbrowser_blur_override';   // null | 'on' | 'off'
const LS_FAVORITES  = 'fooocus2025_assetbrowser_favorites';       // { "loras": [id, ...], "checkpoints": [...], ... }
const LS_SORT       = 'fooocus2025_assetbrowser_sort';            // { "loras": "filename_asc", ... }
const State = {
  spaSettings: { blur_thumbnails: false },   // populated from spa_settings.json on init
  hidden: { /* "outputs:days": Set, "loras:subfolders": Set, ... */ },
  showHidden: false,
  blurActive: false,
  _hiddenChangeListeners: [],
  loadHidden() {
    try {
      const raw = localStorage.getItem(LS_HIDDEN);
      const obj = raw ? JSON.parse(raw) : {};
      this.hidden = {};
      for (const k of Object.keys(obj || {})) {
        this.hidden[k] = new Set(Array.isArray(obj[k]) ? obj[k] : []);
      }
    } catch (e) { this.hidden = {}; }
  },
  saveHidden() {
    const out = {};
    for (const k of Object.keys(this.hidden)) {
      out[k] = Array.from(this.hidden[k]);
    }
    try { localStorage.setItem(LS_HIDDEN, JSON.stringify(out)); } catch (e) {}
    for (const cb of this._hiddenChangeListeners) { try { cb(); } catch (_) {} }
  },
  isHidden(scope, key) {
    return this.hidden[scope] && this.hidden[scope].has(key);
  },
  toggleHidden(scope, key) {
    if (!this.hidden[scope]) this.hidden[scope] = new Set();
    if (this.hidden[scope].has(key)) this.hidden[scope].delete(key);
    else this.hidden[scope].add(key);
    this.saveHidden();
  },
  totalHiddenCount() {
    let n = 0;
    for (const k of Object.keys(this.hidden)) n += this.hidden[k].size;
    return n;
  },
  onHiddenChange(cb) { this._hiddenChangeListeners.push(cb); },

  effectiveBlur() {
    const ovr = localStorage.getItem(LS_BLUR_OVR);
    if (ovr === 'on') return true;
    if (ovr === 'off') return false;
    return !!this.spaSettings.blur_thumbnails;
  },
  setBlurOverride(val) {
    if (val === null) localStorage.removeItem(LS_BLUR_OVR);
    else localStorage.setItem(LS_BLUR_OVR, val ? 'on' : 'off');
    this.applyBlur();
  },
  applyBlur() {
    this.blurActive = this.effectiveBlur();
    document.body.classList.toggle('blur-active', this.blurActive);
    document.getElementById('btn-blur').classList.toggle('on', this.blurActive);
  },

  // --- Favorites: per-kind list of item IDs, backed by localStorage.
  // Kinds: 'loras' | 'checkpoints' | 'embeddings' (NOT 'outputs' — user-validated scope).
  // Stored shape: { loras: Set<id>, checkpoints: Set<id>, embeddings: Set<id> }
  favorites: { loras: new Set(), checkpoints: new Set(), embeddings: new Set() },
  _favoritesChangeListeners: [],
  loadFavorites() {
    try {
      const raw = localStorage.getItem(LS_FAVORITES);
      const obj = raw ? JSON.parse(raw) : {};
      for (const k of ['loras', 'checkpoints', 'embeddings']) {
        this.favorites[k] = new Set(Array.isArray(obj[k]) ? obj[k] : []);
      }
    } catch (e) {
      this.favorites = { loras: new Set(), checkpoints: new Set(), embeddings: new Set() };
    }
  },
  saveFavorites() {
    const out = {};
    for (const k of Object.keys(this.favorites)) out[k] = Array.from(this.favorites[k]);
    try { localStorage.setItem(LS_FAVORITES, JSON.stringify(out)); } catch (e) {}
    for (const cb of this._favoritesChangeListeners) { try { cb(); } catch (_) {} }
  },
  isFavorite(kind, id) {
    return !!(this.favorites[kind] && id && this.favorites[kind].has(id));
  },
  toggleFavorite(kind, id) {
    if (!this.favorites[kind] || !id) return false;
    if (this.favorites[kind].has(id)) { this.favorites[kind].delete(id); }
    else { this.favorites[kind].add(id); }
    this.saveFavorites();
    return this.favorites[kind].has(id);
  },
  favoriteCount(kind) {
    return (this.favorites[kind] && this.favorites[kind].size) || 0;
  },
  onFavoritesChange(cb) { this._favoritesChangeListeners.push(cb); },

  // --- Sort preference: per-kind string key, persisted.
  // Allowed values: 'filename_asc'|'filename_desc'|'modified_desc'|'modified_asc'|'size_desc'|'size_asc'
  // (favorites are ALWAYS pinned at top regardless — user-validated UX choice).
  _sortPrefs: {},
  loadSortPrefs() {
    try {
      const raw = localStorage.getItem(LS_SORT);
      this._sortPrefs = raw ? (JSON.parse(raw) || {}) : {};
    } catch (e) { this._sortPrefs = {}; }
  },
  getSort(kind) { return this._sortPrefs[kind] || 'filename_asc'; },
  setSort(kind, value) {
    this._sortPrefs[kind] = value;
    try { localStorage.setItem(LS_SORT, JSON.stringify(this._sortPrefs)); } catch (e) {}
  },
};
State.loadHidden();
State.loadFavorites();
State.loadSortPrefs();

// Render badge "👁️ Hidden +N" + active state.

// Sidebar item HTML helper — adds the hide/unhide button + greyed style.
function sidebarItemHtml(opts) {
  // opts: { scope, key, label, count, classes:[], active:bool }
  const isHidden = State.isHidden(opts.scope, opts.key);
  if (isHidden && !State.showHidden) return '';   // filtered out
  const classes = ['item', ...(opts.classes || [])];
  if (isHidden) classes.push('hidden-row');
  if (opts.active) classes.push('active');

    ? `<button class="hide-btn" data-toggle-hide="${escapeHtml(opts.scope)}|${escapeHtml(opts.key)}" title="Unhide">↩ unhide</button>`
    : `<button class="hide-btn" data-toggle-hide="${escapeHtml(opts.scope)}|${escapeHtml(opts.key)}" title="Hide from list">\u{1F6AB} hide</button>`;
  const countStr = (opts.count != null) ? `<span class="count">${opts.count}</span>` : '';
  return `<div class="${classes.join(' ')}" data-key="${escapeHtml(opts.key)}">
    <span>${escapeHtml(opts.label)}</span>${countStr}${btn}

// --------- Clipboard helper for the caption Copy buttons ----------
function copyToClipboard(text, btn) {
  const done = () => {
    if (!btn) return;
    const old = btn.textContent;
    btn.textContent = '✓ copied';
    btn.classList.add('ok');
    setTimeout(() => { btn.textContent = old; btn.classList.remove('ok'); }, 1500);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallback());
  } else { fallback(); }
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (_) {}
    document.body.removeChild(ta);
  }
}
// Delegate clicks inside the lightbox caption (PhotoSwipe re-creates the DOM each open).
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-copy]');
  if (t) {
    ev.preventDefault();
    copyToClipboard(t.getAttribute('data-copy'), t);
  }
  // Star toggle from lightbox caption — same UX as the card-level star, but here
  // we have no grid to re-render in place, so we just update the button glyph.
  // The grid will pick up the new state next time the user closes the lightbox
  // and the tab is re-init'd (e.g. on tab switch or search).
  const fav = ev.target.closest('[data-fav-toggle]');
  if (fav) {
    ev.preventDefault();
    const [kind, id] = fav.getAttribute('data-fav-toggle').split('|');
    const nowFav = State.toggleFavorite(kind, id);
    fav.classList.toggle('on', nowFav);
    fav.textContent = nowFav ? '★ Favorite' : '☆ Add to favorites';
    // Best-effort: also update the matching card in the grid (if it's still rendered).
    const card = document.querySelector(`.card[data-item-id="${CSS.escape(id)}"]`);
    if (card) {
      card.classList.toggle('is-favorite', nowFav);
      const cardBtn = card.querySelector('.fav-btn');
      if (cardBtn) {
        cardBtn.classList.toggle('on', nowFav);
        cardBtn.textContent = nowFav ? '★' : '☆';
      }
    }
  }
});

// === CivitAI update-check banner (Phase 3A) ============================
// Each model caption ships with a placeholder `<div class="ab-update-banner checking">`.
// A MutationObserver picks them up as they're inserted by PhotoSwipe's Dynamic
// Caption plugin and fires an async fetch to /run/ab_check_update. The backend
// caches the result for 24h per file, so reopening the same item is instant.
const _bannerScanned = new WeakSet();   // avoid double-fetching the same DOM node

function updateBannerHtml(kind, relPath) {
  if (!HAS_FOOOCUS) return '';  // standalone file:// — no Fooocus backend to ask
  return `<div class="ab-update-banner checking"
            data-update-kind="${escapeHtml(kind)}"
            data-update-rel="${escapeHtml(relPath)}">Checking CivitAI for updates…</div>`;
}

async function fetchUpdateAndPatchBanner(banner) {
  if (_bannerScanned.has(banner)) return;
  _bannerScanned.add(banner);
  const kind = banner.getAttribute('data-update-kind');
  const rel  = banner.getAttribute('data-update-rel');
  if (!kind || !rel) { banner.remove(); return; }
  const body = JSON.stringify({ data: [kind, rel] });
  const opts = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body };
  let result = null;
  for (const url of ['/run/ab_check_update', '/api/ab_check_update']) {
    try {
      const resp = await fetch(url, opts);
      if (!resp.ok) continue;
      const json = await resp.json();
      if (json && Array.isArray(json.data) && json.data.length) result = json.data[0];
      else if (json && typeof json === 'object') result = json;
      if (result) break;
    } catch (e) { /* try next URL */ }
  }
  // Banner might have been removed (lightbox closed) — bail out gracefully.
  if (!banner.isConnected) return;
  if (!result || result.status === 'not_on_civitai' || result.status === 'error') {
    // Silently hide — most non-CivitAI LoRAs would otherwise be visually noisy.
    banner.remove();
    return;
  }
  if (result.status === 'up_to_date') {
    banner.className = 'ab-update-banner ok';
    banner.textContent = `✓ Up to date (v${result.local_version_name || '?'})`;
    return;
  }
  if (result.status === 'update_available' || result.status === 'upgrade_available') {
    const isUpgrade = (result.status === 'upgrade_available');
    banner.className = isUpgrade ? 'ab-update-banner upgrade' : 'ab-update-banner new';
    const sz = (result.latest_size_mb != null) ? ` · ${result.latest_size_mb} MB` : '';
    const dt = result.latest_published_at ? ` · ${result.latest_published_at.slice(0, 10)}` : '';
    const k = banner.getAttribute('data-update-kind');
    const r = banner.getAttribute('data-update-rel');
    // Header line differs depending on whether this is a same-architecture
    // update or a cross-architecture migration (SDXL -> Flux etc).
    const headLine = isUpgrade
      ? `<span>⚠️ <b>Architecture change</b>: <b>${escapeHtml(result.local_base_model || '?')}</b> → <b>${escapeHtml(result.latest_base_model || '?')}</b> — NOT a drop-in update</span>`
      : `<span>🆕 Newer version available: <b>${escapeHtml(result.latest_version_name || '?')}</b>${dt}${sz}</span>`;
    const subLine = isUpgrade
      ? `<span class="ab-update-cur">Latest: <b>${escapeHtml(result.latest_version_name || '?')}</b>${dt}${sz} · Local: <b>${escapeHtml(result.local_version_name || '?')}</b></span>`
      : `<span class="ab-update-cur">Local: v${escapeHtml(result.local_version_name || '?')}</span>`;
    const btnLabel = isUpgrade ? '📥 Replace with different architecture' : '📥 Update from CivitAI';
    banner.innerHTML =
      headLine + subLine +
      `<button class="apply-update"
               data-apply-kind="${escapeHtml(k)}"
               data-apply-rel="${escapeHtml(r)}"
               data-apply-label="${escapeHtml(result.latest_version_name || '?')}"
               data-apply-size="${escapeHtml(String(result.latest_size_mb || ''))}"
               data-apply-model="${escapeHtml(result.model_name || '')}"
               data-apply-local="${escapeHtml(result.local_version_name || '?')}"
               data-apply-local-arch="${escapeHtml(result.local_base_model || '')}"
               data-apply-latest-arch="${escapeHtml(result.latest_base_model || '')}"
               data-apply-is-upgrade="${isUpgrade ? '1' : '0'}"
              >${btnLabel}</button>`;
    return;
  }
  // Unknown status — hide silently.
  banner.remove();
}

// === Apply-update inline panel (Phase 3B v2) ============================
// Click on '📥 Update from CivitAI' (or '📥 Replace with different architecture')
// → the banner expands IN PLACE with 3 backup-mode choices.
// On choice → banner becomes a progress text while POST /run/ab_apply_update runs.
// On success → reload to pick up the rebuilt manifest.

// Build the inline "choose backup mode" panel injected inside an update banner.
function _renderUpdateChoose(meta) {
  const archWarn = meta.isUpgrade
    ? `<div class="um-help" style="color:#ffb84d;"><b>⚠ This is NOT a drop-in replacement.</b> The new file uses a different architecture (${escapeHtml(meta.localArch || '?')} → ${escapeHtml(meta.latestArch || '?')}) and may not load in your current pipeline.</div>`
    : '';
  return `<div class="um-choose">
    ${archWarn}
    <div class="um-help">
      What to do with the current file?<br>
      • <b>Send old to Trash</b> — recoverable from OS recycle bin (recommended).<br>
      • <b>Keep old as .old</b> — old becomes ${escapeHtml(meta.oldStem)}.old${escapeHtml(meta.ext)}, new takes the original name.<br>
      • <b>Keep as it</b> — old stays untouched, new downloaded as ${escapeHtml(meta.oldStem)}.new${escapeHtml(meta.ext)}.
    </div>
    <div class="um-actions">
      <button class="um-cancel">Cancel</button>
      <button data-um-mode="keep">Keep old as .old</button>
      <button data-um-mode="keep_as_is">Keep as it</button>
      <button class="danger" data-um-mode="trash">Send old to Trash</button>
    </div>
  </div>`;
}

// Helpers: derive '<stem>' and '<ext>' from a relative path like 'sub/foo.safetensors'.
function _splitNameForUpdate(rel) {
  const base = (rel || '').split('/').pop();
  const i = base.lastIndexOf('.');
  return i > 0 ? { stem: base.slice(0, i), ext: base.slice(i) } : { stem: base, ext: '' };
}

// Replace the banner content with the "choose backup mode" panel.
function openUpdatePanel(banner, btn) {
  const meta = {
    kind:        btn.getAttribute('data-apply-kind'),
    rel:         btn.getAttribute('data-apply-rel'),
    latestLabel: btn.getAttribute('data-apply-label'),
    sizeMb:      btn.getAttribute('data-apply-size'),
    local:       btn.getAttribute('data-apply-local'),
    localArch:   btn.getAttribute('data-apply-local-arch'),
    latestArch:  btn.getAttribute('data-apply-latest-arch'),
    isUpgrade:   btn.getAttribute('data-apply-is-upgrade') === '1',
  };
  const split = _splitNameForUpdate(meta.rel);
  meta.oldStem = split.stem; meta.ext = split.ext;
  // Snapshot the current banner so Cancel restores it exactly.
  const snapshot = banner.innerHTML;
  banner.insertAdjacentHTML('beforeend', _renderUpdateChoose(meta));
  const choose = banner.querySelector('.um-choose');
  // Cancel: restore snapshot.
  choose.querySelector('.um-cancel').addEventListener('click', () => {
    banner.innerHTML = snapshot;
  });
  // Apply buttons.
  choose.querySelectorAll('[data-um-mode]').forEach(b => {
    b.addEventListener('click', () => applyUpdate(banner, meta, b.getAttribute('data-um-mode')));
  });
}

async function applyUpdate(banner, meta, backupMode) {
  // Extra hard guard for upgrades — make sure the user really gets it.
  if (meta.isUpgrade) {
    if (!confirm(
      `⚠ ARCHITECTURE CHANGE\n\n` +
      `You are about to download a ${meta.latestArch || 'unknown'} file ` +
      `(local is ${meta.localArch || 'unknown'}).\n\n` +
      `This is NOT an update — the two files use completely different neural ` +
      `architectures. The new one likely won't work in pipelines configured ` +
      `for the old one.\n\n` +
      `Continue with mode "${backupMode}"?`
    )) return;
  }
  const sz = meta.sizeMb ? `~${meta.sizeMb} MB` : 'unknown size';
  // Swap content for progress UI.
  const choose = banner.querySelector('.um-choose');
  if (choose) choose.remove();
  banner.insertAdjacentHTML('beforeend',
    `<div class="um-progress">Downloading ${escapeHtml(meta.latestLabel)} (${escapeHtml(sz)})…</div>
     <div class="um-help">Large checkpoints can take several minutes. Do not close this page.</div>`);
  const body = JSON.stringify({ data: [meta.kind, meta.rel, backupMode] });
  const opts = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body };
  let result = null;
  for (const url of ['/run/ab_apply_update', '/api/ab_apply_update']) {
    try {
      const resp = await fetch(url, opts);
      if (!resp.ok) continue;
      const json = await resp.json();
      if (json && Array.isArray(json.data) && json.data.length) result = json.data[0];
      else if (json && typeof json === 'object' && 'success' in json) result = json;
      if (result) break;
    } catch (e) { /* try next URL */ }
  }
  // Remove progress UI, append done block.
  banner.querySelector('.um-progress')?.remove();
  banner.querySelectorAll('.um-help').forEach(e => e.remove());
  if (!result) {
    banner.insertAdjacentHTML('beforeend', `<div class="um-done fail">✗ Network error — see browser console.</div>`);
    return;
  }
  if (!result.success) {
    banner.insertAdjacentHTML('beforeend',
      `<div class="um-done fail">✗ ${escapeHtml(result.message || 'Update failed.')}</div>`);
    return;
  }
  banner.insertAdjacentHTML('beforeend',
    `<div class="um-done ok">✓ ${escapeHtml(result.message || 'Updated.')}<br>Reloading in 2s…</div>`);
  setTimeout(() => window.location.reload(), 2000);
}

// Delegated click for '📥 Update from CivitAI' buttons inside any update banner.
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-apply-kind]');
  if (!t) return;
  // Make sure clicks INSIDE the choose panel don't re-trigger this handler.
  if (t.hasAttribute('data-um-mode') || t.classList.contains('um-cancel')) return;
  ev.preventDefault(); ev.stopPropagation();
  const banner = t.closest('.ab-update-banner');
  if (!banner) return;
  // Disable the Apply button so a double-click can't open two panels.
  t.disabled = true;
  openUpdatePanel(banner, t);
});

// Global observer: pick up any update-banner that gets inserted (PhotoSwipe
// recreates the caption DOM on every slide change, so we cannot rely on
// captionContent being called once).
(function() {
  const scan = (root) => {
    const banners = (root.querySelectorAll
      ? root.querySelectorAll('.ab-update-banner.checking')
      : []);
    banners.forEach(b => fetchUpdateAndPatchBanner(b));
  };
  const mo = new MutationObserver((mutations) => {
    for (const m of mutations) {
      for (const node of m.addedNodes) {
        if (node.nodeType !== 1) continue;  // ELEMENT_NODE only
        if (node.classList && node.classList.contains('ab-update-banner') &&
            node.classList.contains('checking')) {
          fetchUpdateAndPatchBanner(node);
        }
        scan(node);
      }
    }
  });
  mo.observe(document.body, { childList: true, subtree: true });
})();

// Lightbox Delete button — sends file + sidecars to OS trash via the Fooocus
// backend (route /run/ab_delete_file). Hidden in standalone file:// mode.
// 'kind' is one of 'outputs' | 'loras' | 'checkpoints' | 'embeddings'.
// 'rel' for models = the manifest rel_path; for outputs = "date/filename".
function deleteBtnHtml(kind, rel, filenameLabel, sizeBytes) {
  if (!HAS_FOOOCUS) return '';
  const k = escapeHtml(kind);
  const r = escapeHtml(rel);
  const lbl = escapeHtml(filenameLabel || rel);
  const sz = (sizeBytes != null) ? fmtBytes(sizeBytes) : '';
  return `<button class="lb-delete" data-delete-kind="${k}" data-delete-rel="${r}"
            data-delete-label="${lbl}" data-delete-size="${escapeHtml(sz)}"
            title="Delete this file (sent to OS trash by default)">🗑️ Delete</button>`;
}

// Delegated click handler for Delete buttons inside any lightbox caption.
// Uses a detailed confirm() then POSTs to the Gradio /run/ab_delete_file route.
// On success: closes the lightbox + reloads (cheapest way to refresh manifests).
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-delete-kind]');
  if (!t) return;
  ev.preventDefault(); ev.stopPropagation();
  const kind = t.getAttribute('data-delete-kind');
  const rel  = t.getAttribute('data-delete-rel');
  const lbl  = t.getAttribute('data-delete-label') || rel;
  const sz   = t.getAttribute('data-delete-size') || '';
  // What sidecars are likely to disappear too — different per kind.
  const sidecarHint = (kind === 'outputs')
    ? '• Thumbnail sidecar (*_thumb.jpg) if present\n• Entry removed from this day\'s manifest'
    : '• All sidecar previews (.preview.png, .png, .jpg, .webp…)\n'
      + '• Sidecar metadata (.civitai.json, .json, .txt)\n'
      + '• Manifest rebuilt automatically';
  const msg = `Delete this ${kind === 'outputs' ? 'image' : kind.slice(0, -1)}?\n\n`
            + `File:  ${lbl}\n`
            + (sz ? `Size:  ${sz}\n` : '')
            + `\nWill also delete:\n${sidecarHint}\n\n`
            + `Default: sent to OS trash (recoverable).\n`
            + `If send2trash isn't installed, falls back to permanent delete.`;
  if (!confirm(msg)) return;
  // Disable button + visual feedback.
  const orig = t.textContent;
  t.disabled = true; t.textContent = '🗑️ Deleting…';
  const body = JSON.stringify({ data: [kind, rel] });
  const opts = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body };
  let result = null;
  for (const url of ['/run/ab_delete_file', '/api/ab_delete_file']) {
    try {
      const resp = await fetch(url, opts);
      if (!resp.ok) continue;
      const json = await resp.json();
      if (json && Array.isArray(json.data) && json.data.length) result = json.data[0];
      else if (json && typeof json === 'object' && 'success' in json) result = json;
      if (result) break;
    } catch (e) { /* try next */ }
  }
  if (!result) {
    t.textContent = '✗ Network error';
    t.style.background = 'rgba(200,60,60,0.4)';
    setTimeout(() => { t.textContent = orig; t.disabled = false; t.style.background = ''; }, 4000);
    return;
  }
  if (!result.success) {
    t.textContent = '✗ ' + (result.message || 'Failed');
    t.style.background = 'rgba(200,60,60,0.4)';
    setTimeout(() => { t.textContent = orig; t.disabled = false; t.style.background = ''; }, 5000);
    return;
  }
  t.textContent = '✓ ' + (result.message || 'Deleted') + ' — reloading…';
  t.style.background = 'rgba(78,205,196,0.4)';
  // Same UX as the CivitAI single-fetch button: full reload picks up the
  // rebuilt manifests cleanly.
  setTimeout(() => { window.location.reload(); }, 1200);
});

// --------- Lightbox factory (one per tab kind) ----------
const _lightboxes = {};
function getLightbox(kind, captionRenderer) {
  if (_lightboxes[kind]) return _lightboxes[kind];
  const lb = new PhotoSwipeLightbox({
    pswpModule: PhotoSwipe,
    bgOpacity: 0.92,
    showHideAnimationType: 'fade',
    // Generous padding all around — Dynamic Caption ('aside' mode) auto-positions
    // itself next to the image without overlap and switches to 'below' when there's
    // not enough horizontal room. We just need to leave breathing room.
    padding: { top: 30, bottom: 30, left: 30, right: 30 },
  });
  new PhotoSwipeDynamicCaption(lb, {
    type: 'aside',
    captionContent: (slide) => captionRenderer(slide.data),
  });
  new DeepZoom(lb, {
    tileSize: 256,
    incrementalZoomButtons: false,
  });
  lb.init();
  _lightboxes[kind] = lb;
  return lb;
}

// --------- Fetch CivitAI preview helper (calls Fooocus API endpoint) ----------
// Only available when the SPA is served via HTTP (i.e. opened from Fooocus).
// In standalone file:// mode the Fetch button is hidden (HAS_FOOOCUS = false).
const HAS_FOOOCUS = (window.location.protocol === 'http:' || window.location.protocol === 'https:');

function fetchCivitaiPreviewBtnHtml(kind, relPath) {
  if (!HAS_FOOOCUS) return '';   // standalone mode — no Fooocus to call
  const k = escapeHtml(kind);
  const r = escapeHtml(relPath);
  return `<button class="fetch-civitai-btn" data-fetch-kind="${k}" data-fetch-rel="${r}"
            title="Download the top CivitAI image for this model and save it as a sidecar preview.">
            🌐 Fetch from CivitAI
          </button>`;
}

async function fetchCivitaiPreview(kind, relPath, btn) {
  if (!btn) return;
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ Fetching from CivitAI…';
  // Try Gradio's /run/<api_name> first, fall back to /api/<api_name>.
  const body = JSON.stringify({ data: [kind, relPath] });
  const opts = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body };
  let result = null;
  for (const url of ['/run/ab_fetch_preview', '/api/ab_fetch_preview']) {
    try {
      const resp = await fetch(url, opts);
      if (!resp.ok) continue;
      const json = await resp.json();
      // Gradio v3.x returns { data: [output1, ...] }, sometimes nested.
      if (json && Array.isArray(json.data) && json.data.length) {
        result = json.data[0];
      } else if (json && typeof json === 'object' && 'success' in json) {
        result = json;
      }
      if (result) break;
    } catch (e) { /* try next */ }
  }
  if (!result) {
    btn.textContent = '✗ Network error — see console';
    btn.style.background = 'rgba(200,60,60,0.4)';
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; btn.style.background = ''; }, 4000);
    return;
  }
  if (!result.success) {
    btn.textContent = '✗ ' + (result.message || 'Failed');
    btn.style.background = 'rgba(200,60,60,0.4)';
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; btn.style.background = ''; }, 4000);
    return;
  }
  btn.textContent = '✓ ' + (result.message || 'Fetched') + ' — reloading…';
  btn.style.background = 'rgba(78,205,196,0.4)';
  setTimeout(() => { window.location.reload(); }, 1200);
}

// Delegated click handler — fires for any button with data-fetch-kind, even
// when PhotoSwipe rebuilds the caption DOM between slides.
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-fetch-kind]');
  if (!t) return;
  ev.preventDefault(); ev.stopPropagation();
  fetchCivitaiPreview(t.getAttribute('data-fetch-kind'), t.getAttribute('data-fetch-rel'), t);
});

  const m = d._fooocusMeta || {};

  const pushRow = (k, v) => { if (v != null && v !== '') rows.push({k, v}); };
  pushRow('Sampler', get('sampler') || get('sampler_name'));
  pushRow('Scheduler', get('scheduler') || get('scheduler_name'));
  pushRow('CFG',     get('guidance_scale') || get('cfg_scale') || get('cfg'));

  pushRow('Created', d._createdAt);

    <div class="copy-row">

      ${negativeText ? `<button data-copy="${escapeHtml(negativeText)}">📋 Negative</button>` : ''}

// --------- Image dimension probe (used when manifest doesn't have width/height) ----------
const _dimCache = new Map();
function probeDimensions(url) {
  if (_dimCache.has(url)) return Promise.resolve(_dimCache.get(url));
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { const d = {w: img.naturalWidth, h: img.naturalHeight}; _dimCache.set(url, d); resolve(d); };
    img.onerror = () => { const d = {w: 1024, h: 1024}; _dimCache.set(url, d); resolve(d); };
    img.src = url;
  });
}

// --------- OUTPUTS TAB ----------
const Outputs = {
  days: [], today: null, activeDate: null, _slides: [],
  async init() {
    $sidebarTitle.textContent = 'Days';
    const idx = await fetchJson('./_index/days.json');
    if (!idx) {
      renderEmpty($sidebarList, 'No <code>_index/days.json</code>.');
      renderEmpty($main, 'Asset Browser has not built its outputs index yet.<br><br>'
        + 'In Fooocus go to <b>Advanced → 🖼️ Asset Browser</b> and click '
        + '<code>🔄 Reindex everything now</code>, or generate a new image.');
      return;
    }
    this.days = idx.days || []; this.today = idx.today;
    this.renderSidebar();
    const initial = this.days.find(d => d.date === this.today) || this.days[0];
    if (initial) this.loadDay(initial.date);
    else renderEmpty($main, '<b>No days yet.</b>');
  },
  renderSidebar() {
    if (this.days.length === 0) { renderEmpty($sidebarList, 'No days indexed.'); return; }
    const html = this.days.map(d => sidebarItemHtml({
      scope: 'outputs:days', key: d.date, label: d.date, count: d.count,
      classes: d.date === this.today ? ['today'] : [],
      active: d.date === this.activeDate,
    })).join('');
    $sidebarList.innerHTML = html || '<div class="empty">All days hidden — click 👁️ Hidden in the header.</div>';
    $sidebarList.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', (ev) => {
        if (ev.target.closest('.hide-btn')) return;   // handled by global delegate
        this.loadDay(el.dataset.key);
      });
    });
  },
  async loadDay(date) {
    this.activeDate = date;
    this.renderSidebar();
    const manifest = await fetchJson(`./${date}/manifest.json`);
    if (!manifest || !manifest.images || manifest.images.length === 0) {
      renderEmpty($main, `No manifest for ${date} yet.`); return;
    }
    // Prepare slides for the lightbox.
    this._slides = await Promise.all(manifest.images.map(async (img) => {
      let w = img.width, h = img.height;
      if (!w || !h) { const d = await probeDimensions(`./${date}/${img.src}`); w = d.w; h = d.h; }
      return {
        src: `./${date}/${encodeURIComponent(img.src)}`,
        msrc: img.thumb ? `./${date}/${encodeURIComponent(img.thumb)}` : undefined,
        width: w, height: h,
        _filename: img.src,
        _date: date,                 // needed by the Delete button (rel_path = date/filename)
        _sizeBytes: img.size_bytes,  // shown in the Delete confirmation
        _createdAt: img.created_at,
        _fooocusMeta: img.metadata || {},
      };
    }));
    const lb = getLightbox('outputs', captionImage);
    lb.options.dataSource = this._slides;
    $main.innerHTML = `<div class="grid">${manifest.images.map((img, i) => {
      const thumb = img.thumb || img.src;
      return `<div class="card" data-idx="${i}" title="${escapeHtml(img.src)}">
        <img loading="lazy" src="./${date}/${encodeURIComponent(thumb)}" alt="">
        <div class="label">${escapeHtml(img.src)}</div>
      </div>`;
    }).join('')}</div>`;
    $main.querySelectorAll('.card').forEach(el => {
      el.addEventListener('click', () => lb.loadAndOpen(parseInt(el.dataset.idx, 10)));
    });
    $footer.textContent = `${date} — ${fmtCount(manifest.images.length, 'image')}`;
  },
};

// --------- MODELS TABS (loras / checkpoints / embeddings) ----------
function buildModelsTab(kind, opts) {
  return {
    kind, file: `./_index/${kind}.json`,
    items: [], subfolders: [], activeSubfolder: '__all__', _slides: [],
    async init() {
      $sidebarTitle.textContent = opts.sidebarTitle;
      // Sync the sort dropdown to this tab's stored preference (per-kind).
      const sortSel = document.getElementById('sort-select');
      if (sortSel) sortSel.value = State.getSort(this.kind);
      const idx = await fetchJson(this.file);
      if (!idx || !idx.items || idx.items.length === 0) {
        renderEmpty($sidebarList, `No <code>${kind}.json</code> yet.`);
        renderEmpty($main, `<b>${opts.emptyTitle}</b><br><br>`
          + 'Click <code>🔄 Reindex everything now</code> in Fooocus → '
          + 'Advanced → 🖼️ Asset Browser to scan your <code>'
          + opts.modelsDir + '</code> folder.');
        return;
      }
      this.items = idx.items;
      this.subfolders = this.computeSubfolders();
      this.renderSidebar();
      this.renderGrid();
      $footer.textContent = `${fmtCount(this.items.length, opts.unit)} indexed at ${idx.generated_at || '?'}`;
    },
    computeSubfolders() {
      const counts = new Map();
      for (const it of this.items) {
        const f = it.subfolder || '.';
        counts.set(f, (counts.get(f) || 0) + 1);
      }
      return Array.from(counts.entries())
        .map(([name, count]) => ({ name, count }))
        .sort((a, b) => a.name.localeCompare(b.name));
    },
    renderSidebar() {
      const total = this.items.length;
      const favCount = State.favoriteCount(this.kind);
      const scope = `${this.kind}:subfolders`;
      // Two virtual entries at the top — neither can be hidden.
      // 1) ⭐ Favorites — only shown if at least one star exists in this kind (avoids clutter).
      // 2) 'All' — always shown.
      const favHead = favCount > 0
        ? `<div class="item fav-row${this.activeSubfolder === '__favorites__' ? ' active' : ''}" data-sub="__favorites__">
              <span>⭐ Favorites</span><span class="count">${favCount}</span></div>`
        : '';
      const head = `<div class="item${this.activeSubfolder === '__all__' ? ' active' : ''}" data-sub="__all__">
          <span>All</span><span class="count">${total}</span></div>`;
      const rest = this.subfolders.map(sf => sidebarItemHtml({
        scope, key: sf.name,
        label: sf.name === '.' ? '(root)' : sf.name,
        count: sf.count,
        active: this.activeSubfolder === sf.name,
      })).join('');
      $sidebarList.innerHTML = favHead + head + rest;
      $sidebarList.querySelectorAll('.item').forEach(el => {
        el.addEventListener('click', (ev) => {
          if (ev.target.closest('.hide-btn')) return;
          // 'All' and 'Favorites' use data-sub, sub-folders use data-key (from sidebarItemHtml).
          const sub = el.dataset.sub != null ? el.dataset.sub : el.dataset.key;
          this.activeSubfolder = sub;
          this.renderSidebar(); this.renderGrid();
        });
      });
    },
    async renderGrid() {
      const scope = `${this.kind}:subfolders`;
      // Filter out items whose subfolder is hidden — unless 'show hidden' is on
      // OR the active subfolder is exactly that hidden one (user navigated to it).
      const subfolderVisible = (sf) => {
        if (State.showHidden) return true;
        if (this.activeSubfolder !== '__all__' && this.activeSubfolder === sf) return true;
        return !State.isHidden(scope, sf);
      };
      let filtered;
      if (this.activeSubfolder === '__favorites__') {
        // Only items starred for THIS kind, regardless of subfolder. We deliberately
        // ignore the hidden-subfolder filter here — a starred item must never vanish
        // because its parent folder got hidden.
        filtered = this.items.filter(it => State.isFavorite(this.kind, it.id));
      } else if (this.activeSubfolder === '__all__') {
        filtered = this.items.filter(it => subfolderVisible(it.subfolder || '.'));
      } else {
        filtered = this.items.filter(it => (it.subfolder || '.') === this.activeSubfolder);
      }
      // Search filter — match against filename, trigger_words, prompt, rel_path
      const q = (document.getElementById('search-input') || {}).value || '';
      if (q.trim()) {
        const lq = q.toLowerCase().trim();
        filtered = filtered.filter(it => {
          // trigger_words is an array (see model_indexer._build_lora_item).
          // Flatten to a string before searching; otherwise f.toLowerCase()
          // throws on the array and the whole filter() callback dies silently
          // — that was the reason the LoRAs tab search appeared to "do nothing".
          const tw = Array.isArray(it.trigger_words)
            ? it.trigger_words.join(' ')
            : it.trigger_words;
          const fields = [it.filename, it.rel_path, tw,
                          it.metadata && it.metadata.prompt,
                          it.metadata && it.metadata.negative_prompt].filter(Boolean);
          return fields.some(f => String(f).toLowerCase().includes(lq));
        });
      }
      // Sort — favorites always pinned at top, then user-chosen criterion below.
      // (User-validated UX: favorites are NEVER demoted regardless of sort order.)
      const sortKey = State.getSort(this.kind);
      const cmpFilename = (a, b) => (a.filename || '').localeCompare(b.filename || '');
      const cmpModified = (a, b) => (a.modified_at || '').localeCompare(b.modified_at || '');
      const cmpSize     = (a, b) => (a.size_bytes || 0) - (b.size_bytes || 0);
      const baseCmp = {
        filename_asc:   cmpFilename,
        filename_desc:  (a, b) => -cmpFilename(a, b),
        modified_desc:  (a, b) => -cmpModified(a, b),
        modified_asc:   cmpModified,
        size_desc:      (a, b) => -cmpSize(a, b),
        size_asc:       cmpSize,
      }[sortKey] || cmpFilename;
      filtered.sort((a, b) => {
        // Favorites first — only relevant when NOT already in the Favorites virtual tab
        // (in that case all items are favorites so this is a no-op).
        const fa = State.isFavorite(this.kind, a.id) ? 1 : 0;
        const fb = State.isFavorite(this.kind, b.id) ? 1 : 0;
        if (fa !== fb) return fb - fa;   // favorite (1) before non-favorite (0)
        return baseCmp(a, b);
      });

      if (filtered.length === 0) { renderEmpty($main, 'Nothing to show here.'); return; }

      // Slides for lightbox — uses preview_full (full-res sidecar copy) and
      // dimensions stored in the manifest. Avoids the previous `probeDimensions`
      // pass that was fetching every preview file just to read width/height
      // (catastrophic on tabs with thousands of items).
      this._slides = filtered.map((it) => {
        const fullSrc = it.preview_full || it.preview;
        const url = fullSrc ? `./${fullSrc}` : '';
        return {
          src: url,
          msrc: it.preview ? `./${it.preview}` : undefined,
          width:  it.preview_width  || 1024,   // 1024 default = our placeholder size
          height: it.preview_height || 1024,
          _item: it,
        };
      });
      const lb = getLightbox(this.kind, opts.captionRenderer);
      lb.options.dataSource = this._slides;

      $main.innerHTML = `<div class="grid">${filtered.map((it, i) => this.renderCard(it, i)).join('')}</div>`;
      $main.querySelectorAll('.card').forEach(el => {
        el.addEventListener('click', (ev) => {
          // Ignore clicks that originated on the favorite star — it has its own handler.
          if (ev.target.closest('.fav-btn')) return;
          lb.loadAndOpen(parseInt(el.dataset.idx, 10));
        });
      });
      // Favorite star handler — toggles State + glyph + .is-favorite outline in place,
      // without re-rendering the whole grid (which would be visually jarring).
      const self = this;
      $main.querySelectorAll('.fav-btn').forEach(btn => {
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          ev.preventDefault();
          const id = btn.getAttribute('data-fav-id');
          const nowFav = State.toggleFavorite(self.kind, id);
          btn.classList.toggle('on', nowFav);
          btn.textContent = nowFav ? '★' : '☆';
          btn.title = nowFav ? 'Remove from favorites' : 'Add to favorites';
          const card = btn.closest('.card');
          if (card) card.classList.toggle('is-favorite', nowFav);
          // If we're currently viewing the Favorites virtual subfolder, removing the
          // last star on a visible card should hide it. Cheapest: re-render the grid.
          if (self.activeSubfolder === '__favorites__' && !nowFav) {
            self.renderSidebar(); self.renderGrid();
          } else {
            // Otherwise just keep the sidebar count fresh.
            self.renderSidebar();
          }
        });
      });
    },
    renderCard(it, i) {
      const previewSrc = it.preview ? `./${it.preview}` : '';
      const isFav = State.isFavorite(this.kind, it.id);
      const cls = ['card']; if (it.preview_kind === 'placeholder') cls.push('placeholder');
      if (it.is_negative_hint) cls.push('negative');
      if (isFav) cls.push('is-favorite');
      const badges = [];
      if (it.trigger_words && it.trigger_words.length)
        badges.push(`<span title="${escapeHtml(it.trigger_words.join(', '))}">⚡ ${it.trigger_words.length}</span>`);
      if (it.civitai_url) badges.push(`<span title="On CivitAI">🔗</span>`);
      if (it.is_negative_hint) badges.push(`<span title="Likely a negative-prompt embedding">−</span>`);
      if (it.civitai_consensus) badges.push(`<span title="Has CivitAI consensus settings">📊</span>`);
      const label = it.filename;
      const titleAttr = `${it.rel_path} · ${fmtBytes(it.size_bytes)}`
        + (it.trigger_words && it.trigger_words.length ? `\nTriggers: ${it.trigger_words.join(', ')}` : '');
      // Star button — data-fav-id wires it to the delegated click handler below.
      // We render ☆/★ as glyphs (not emoji) for crisp color control via CSS.
      const starBtn = `<button class="fav-btn${isFav ? ' on' : ''}" data-fav-id="${escapeHtml(it.id)}"
                              title="${isFav ? 'Remove from favorites' : 'Add to favorites'}">${isFav ? '★' : '☆'}</button>`;
      return `<div class="${cls.join(' ')}" data-idx="${i}" data-item-id="${escapeHtml(it.id)}" title="${escapeHtml(titleAttr)}">
        ${previewSrc
          ? `<img loading="lazy" src="${escapeHtml(previewSrc)}" alt="">`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#444">no preview</div>`}
        ${starBtn}
        ${badges.length ? `<div class="badges">${badges.join('')}</div>` : ''}
        <div class="label">${escapeHtml(label)}</div>
      </div>`;
    },
  };
}

const tabs = {
  outputs: Outputs,
  loras: buildModelsTab('loras', {
    sidebarTitle: 'Subfolders', emptyTitle: 'No LoRAs indexed',
    modelsDir: 'models/loras/', unit: 'LoRA',
    captionRenderer: captionLora,
  }),
  checkpoints: buildModelsTab('checkpoints', {
    sidebarTitle: 'Subfolders', emptyTitle: 'No checkpoints indexed',
    modelsDir: 'models/checkpoints/', unit: 'checkpoint',
    captionRenderer: captionCheckpoint,
  }),
  embeddings: buildModelsTab('embeddings', {
    sidebarTitle: 'Subfolders', emptyTitle: 'No embeddings indexed',
    modelsDir: 'models/embeddings/', unit: 'embedding',
    captionRenderer: captionEmbedding,
  }),
};

function setActiveTab(name) {
  $tabs.querySelectorAll('button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === name));
  if (window.location.hash.replace('#', '') !== name) {
    history.replaceState(null, '', '#' + name);
  }
  if (tabs[name]) tabs[name].init();
}

$tabs.querySelectorAll('button').forEach(b => {
  if (b.disabled) return;
  b.addEventListener('click', () => setActiveTab(b.dataset.tab));
});

// =================== Header toggles + delegated hide/unhide ===================
let _activeTabName = 'outputs';
function _reInitActiveTab() { if (tabs[_activeTabName]) tabs[_activeTabName].init(); }

document.getElementById('btn-blur').addEventListener('click', () => {
  // Cycle: default -> opposite override -> back to default.
  const cur = State.effectiveBlur();
  const ovr = localStorage.getItem(LS_BLUR_OVR);
  if (ovr === null) {
    State.setBlurOverride(!State.spaSettings.blur_thumbnails);
  } else {
    State.setBlurOverride(null);
    State.applyBlur();
  }
});
document.getElementById('btn-show-hidden').addEventListener('click', () => {
  State.showHidden = !State.showHidden;
  refreshHeaderToggles();
  _reInitActiveTab();   // re-render the current tab so hidden items come back / disappear
});

// Search filter — debounced re-render on input
(function() {
  const searchEl = document.getElementById('search-input');
  let timer = null;
  searchEl.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => _reInitActiveTab(), 200);
  });
  // Clear search when switching tabs
  document.querySelectorAll('#tabs button').forEach(b => {
    b.addEventListener('click', () => { searchEl.value = ''; });
  });
})();

// Sort selector — persists per-kind, instant re-render on change.
// Hidden on the Outputs tab (which is grouped by date, no sort UI needed).
(function() {
  const sortSel = document.getElementById('sort-select');
  if (!sortSel) return;
  sortSel.addEventListener('change', () => {
    if (_activeTabName === 'outputs') return;   // nothing to do on the Outputs tab
    State.setSort(_activeTabName, sortSel.value);
    _reInitActiveTab();
  });
  // Hide on Outputs tab, show on every other tab.
  function syncSortVisibility() {
    sortSel.style.display = (_activeTabName === 'outputs') ? 'none' : '';
  }
  document.querySelectorAll('#tabs button').forEach(b => {
    b.addEventListener('click', () => {
      // _activeTabName is updated by the setActiveTab wrapper further down — but
      // it runs AFTER the click handler chain. Read the dataset directly here.
      const tabName = b.dataset.tab;
      sortSel.style.display = (tabName === 'outputs') ? 'none' : '';
      if (tabName !== 'outputs') sortSel.value = State.getSort(tabName);
    });
  });
  // Initial visibility — outputs is the default active tab.
  syncSortVisibility();
})();

// Delegated click for hide/unhide buttons in the sidebar.
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-toggle-hide]');
  if (!t) return;
  ev.preventDefault();
  ev.stopPropagation();
  const [scope, key] = t.getAttribute('data-toggle-hide').split('|');
  State.toggleHidden(scope, key);
  refreshHeaderToggles();
  _reInitActiveTab();
});

// Wrap setActiveTab to remember the active tab name (so re-renders go to the right place).
const _origSetActiveTab = setActiveTab;
setActiveTab = function(name) {
  _activeTabName = name;
  return _origSetActiveTab(name);
};

// =================== Batch CivitAI fetch ===================
// Walks LoRAs + checkpoints + embeddings manifests, finds every item whose
// preview_kind === 'placeholder' (no sidecar preview on disk), and downloads
// the top CivitAI image for each — sequentially, with throttle, polite.
// Designed to be re-runnable: items that already have a preview are skipped.
const Batch = {
  running: false,
  cancelled: false,
  items: [],          // [{kind, rel_path, filename}]
  done: 0,
  ok: 0,
  skipped: 0,         // soft fails — model not on CivitAI / no images / etc.
  ko: 0,              // hard fails — network / rate-limit / unknown error
  consecutiveFails: 0,
  THROTTLE_MS: 1500,           // user-validated default
  MAX_CONSECUTIVE_FAILS: 5,    // hard-fail-only guard (rate-limit / network)

  // Substrings (case-insensitive) that mean "this model legitimately can't be
  // fetched from CivitAI" — NOT a transport-level problem. We skip & continue
  // without incrementing consecutiveFails. Whole list comes from backend
  // model_indexer.fetch_civitai_preview_for() error paths.
  SOFT_FAIL_PATTERNS: [
    'not found on civitai',          // hash unknown → user has non-CivitAI lora
    'no images for this model',      // CivitAI knows the model but has no preview
    'no usable image url',           // CivitAI returned malformed image list
    'no version id',                 // CivitAI version response missing id
    'could not hash',                // local I/O issue on the model file
    'model not found on disk',       // user removed the file between scans
    'sidecar preview already exists',// race vs single-fetch in lightbox
    'unknown kind',                  // programmer error, not a CivitAI problem
  ],

  async collectAllPlaceholders() {
    const kinds = ['loras', 'checkpoints', 'embeddings'];
    const all = [];
    for (const k of kinds) {
      const idx = await fetchJson(`./_index/${k}.json`);
      if (!idx || !Array.isArray(idx.items)) continue;
      for (const it of idx.items) {
        if (it.preview_kind === 'placeholder') {
          all.push({ kind: k, rel_path: it.rel_path, filename: it.filename });
        }
      }
    }
    return all;
  },

  async refreshButton() {
    const btn = document.getElementById('btn-batch-fetch');
    if (!btn) return;
    if (!HAS_FOOOCUS) { btn.style.display = 'none'; return; }
    const all = await this.collectAllPlaceholders();
    if (all.length === 0) { btn.style.display = 'none'; return; }
    btn.style.display = '';
    btn.innerHTML = `\u{1F310} Fetch missing <span class="pill">${all.length}</span>`;
  },

  async start() {
    if (this.running) return;
    const items = await this.collectAllPlaceholders();
    if (items.length === 0) {
      alert('No missing previews to fetch — everything already has a sidecar image.');
      return;
    }
    const eta = Math.ceil((items.length * this.THROTTLE_MS) / 1000);
    const m = Math.floor(eta / 60), s = eta % 60;
    const etaStr = m > 0 ? `~${m}m ${s}s` : `~${s}s`;
    if (!confirm(`Fetch ${items.length} missing CivitAI previews?\n\n` +
                 `• Throttle: ${this.THROTTLE_MS}ms between requests\n` +
                 `• Estimated time: ${etaStr}\n` +
                 `• Models legitimately absent from CivitAI are skipped (no penalty)\n` +
                 `• Auto-stop only after ${this.MAX_CONSECUTIVE_FAILS} consecutive HARD failures (network / rate-limit)\n` +
                 `• You can Cancel at any time from the progress panel`)) return;

    this.running = true; this.cancelled = false;
    this.items = items; this.done = 0; this.ok = 0; this.skipped = 0; this.ko = 0; this.consecutiveFails = 0;
    this.showOverlay();
    this.updateOverlay();
    document.getElementById('btn-batch-fetch').disabled = true;
    await this.loop();
    this.finish();
  },

  async loop() {
    for (const item of this.items) {
      if (this.cancelled) break;
      // Auto-stop guard targets ONLY hard failures (network / rate-limit / unknown).
      // "Not found on CivitAI" etc. are legitimate skips and don't count here —
      // a user with 200 non-CivitAI LoRAs would otherwise hit this on item #6.
      if (this.consecutiveFails >= this.MAX_CONSECUTIVE_FAILS) {
        console.warn(`[batch] stopping after ${this.consecutiveFails} consecutive HARD failures — likely rate-limited or network down`);
        break;
      }
      this.setCurrent(item.filename);
      const outcome = await this.fetchOne(item);   // 'ok' | 'soft' | 'hard'
      if (outcome === 'ok')        { this.ok++;      this.consecutiveFails = 0; }
      else if (outcome === 'soft') { this.skipped++; this.consecutiveFails = 0; }
      else                          { this.ko++;     this.consecutiveFails++; }
      this.done++;
      this.updateOverlay();
      // Throttle, but skip the wait after the very last one
      if (this.done < this.items.length && !this.cancelled) {
        await new Promise(r => setTimeout(r, this.THROTTLE_MS));
      }
    }
  },

  // Classify the outcome of a single fetch:
  //   'ok'   — preview saved
  //   'soft' — backend said "no, but legitimately" (not on CivitAI, no images…) — skip & continue
  //   'hard' — network error / rate-limit / unknown failure — counts toward auto-stop
  classify(result) {
    if (!result) return 'hard';
    if (result.success) return 'ok';
    const msg = String(result.message || '').toLowerCase();
    for (const pat of this.SOFT_FAIL_PATTERNS) {
      if (msg.includes(pat)) return 'soft';
    }
    return 'hard';
  },

  async fetchOne(item) {
    const body = JSON.stringify({ data: [item.kind, item.rel_path] });
    const opts = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body };
    for (const url of ['/run/ab_fetch_preview', '/api/ab_fetch_preview']) {
      try {
        const resp = await fetch(url, opts);
        if (!resp.ok) continue;   // try next URL
        const json = await resp.json();
        let result = null;
        if (json && Array.isArray(json.data) && json.data.length) result = json.data[0];
        else if (json && typeof json === 'object' && 'success' in json) result = json;
        if (!result) continue;
        const outcome = this.classify(result);
        if (outcome !== 'ok') {
          const tag = outcome === 'soft' ? 'skip' : 'fail';
          console.warn(`[batch ${tag}] ${item.kind}/${item.rel_path}: ${result.message || 'unknown'}`);
        }
        return outcome;
      } catch (e) {
        console.warn(`[batch fail] ${item.kind}/${item.rel_path}: network error`, e);
        // Network exception — try next URL; if none work, fall through to 'hard'
      }
    }
    return 'hard';
  },

  setCurrent(name) {
    const el = document.getElementById('batch-current');
    if (el) el.textContent = name;
  },
  updateOverlay() {
    const total = this.items.length;
    document.getElementById('batch-progress').textContent = `${this.done} / ${total}`;
    document.getElementById('batch-ok').textContent = this.ok;
    document.getElementById('batch-skipped').textContent = this.skipped;
    document.getElementById('batch-ko').textContent = this.ko;
    const pct = total > 0 ? (this.done / total) * 100 : 0;
    document.getElementById('batch-fill').style.width = pct.toFixed(1) + '%';
  },
  showOverlay() {
    document.getElementById('batch-overlay').classList.add('on');
    document.getElementById('batch-cancel').style.display = '';
    document.getElementById('batch-close').style.display = 'none';
  },
  hideOverlay() {
    document.getElementById('batch-overlay').classList.remove('on');
  },

  finish() {
    this.running = false;
    this.setCurrent(this.cancelled ? '(cancelled)' : '(done)');
    // Flip Cancel -> Close & reload. Reloading picks up the new previews
    // (gallery_writer rebuilds manifests when sidecar files appear).
    document.getElementById('batch-cancel').style.display = 'none';
    const closeBtn = document.getElementById('batch-close');
    closeBtn.style.display = '';
    closeBtn.textContent = this.ok > 0 ? `Close & reload (${this.ok} new)` : 'Close';
    const btn = document.getElementById('btn-batch-fetch');
    if (btn) btn.disabled = false;
  },

  cancel() {
    if (!this.running) return;
    this.cancelled = true;
    document.getElementById('batch-current').textContent = '(cancelling after current request…)';
  },
};

// Wire up the button + overlay actions.
(function() {
  const btn = document.getElementById('btn-batch-fetch');
  if (btn) btn.addEventListener('click', () => Batch.start());
  const cancelBtn = document.getElementById('batch-cancel');
  if (cancelBtn) cancelBtn.addEventListener('click', () => Batch.cancel());
  const closeBtn = document.getElementById('batch-close');
  if (closeBtn) closeBtn.addEventListener('click', () => {
    Batch.hideOverlay();
    // Reload only if at least one new preview was fetched.
    if (Batch.ok > 0) window.location.reload();
  });
})();

// =================== Boot ===================
(async () => {
  // Load SPA-side settings (blur default written by gallery_writer.ensure_gallery_assets).
  const s = await fetchJson('./_index/spa_settings.json');
  if (s && typeof s === 'object') State.spaSettings = Object.assign(State.spaSettings, s);
  State.applyBlur();
  refreshHeaderToggles();

  // Initial tab from URL hash, fallback to outputs.
  const initial = (window.location.hash || '#outputs').replace('#', '');
  setActiveTab(tabs[initial] ? initial : 'outputs');

  // Show/hide + counter for the "🌐 Fetch missing" header button.
  // Fire-and-forget — Batch reads the same _index/*.json manifests as the tabs.
  Batch.refreshButton();
})();
</script>
